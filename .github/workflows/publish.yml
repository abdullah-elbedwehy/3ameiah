name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci
      - run: npm run test:all
      - name: Require tag and package versions to match
        run: node -e 'const p=require("./package.json"); const tag=process.env.GITHUB_REF_NAME; const expected="v"+p.version; if(tag!==expected) throw new Error("Tag "+tag+" does not match package "+p.version)'
      - run: npm publish
