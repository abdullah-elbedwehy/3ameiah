name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.20.0, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci
      - run: npm run test:all

  package-smoke:
    name: Packed tarball smoke test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci
      - name: Pack and install the exact published payload
        run: |
          npm pack --silent
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_TARBALL="3ameiah-${PACKAGE_VERSION}.tgz"
          test -f "$PACKAGE_TARBALL"
          TEST_DIR=$(mktemp -d)
          npm install --prefix "$TEST_DIR" "$PWD/$PACKAGE_TARBALL"
          "$TEST_DIR/node_modules/.bin/3ameiah" --version
          "$TEST_DIR/node_modules/.bin/3ameiah" install --dry-run
          THREEAMEIAH_CONFIG_DIR="$TEST_DIR/config" "$TEST_DIR/node_modules/.bin/3ameiah" learn smoke --yes --about "package test" --json
          cd "$TEST_DIR"
          THREEAMEIAH_CONFIG_DIR="$TEST_DIR/config" "$TEST_DIR/node_modules/.bin/3ameiah-use" smoke --json

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
